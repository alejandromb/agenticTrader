[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "agentic-trading"
version = "0.1.0"
description = "Evidence-driven investment research copilot"
readme = "Agentic_Trading_Project_Summary.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.18,<2",
  "jsonschema[format]>=4.23,<5",
  "openai>=2,<3",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
  "sqlalchemy>=2.0,<2.1",
]

[project.scripts]
agentic-trading = "agentic_trading.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_trading"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
