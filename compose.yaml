services:
  app:
    build:
      context: .
      target: runtime
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-2026-03-05}
      SEC_USER_AGENT: ${SEC_USER_AGENT:-}
    volumes:
      - workflow-data:/app/data
      - evidence-artifacts:/app/artifacts
    command: ["--help"]

  test:
    profiles: ["test"]
    build:
      context: .
      target: development
    working_dir: /build
    command: ["pytest"]

volumes:
  workflow-data:
  evidence-artifacts:
